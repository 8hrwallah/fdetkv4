<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>YouTube Player | Snorlax's Cave</title>
    <link rel="icon" href="/assets/img/newlogo.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #000; }
      body { display: grid; place-items: center; }
      main { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
      #message { color: #fff; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
    </style>
  </head>
  <body>
    <main id="player-shell">
      <iframe
        id="youtube-player"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen
      ></iframe>
    </main>
    <script>
      const videoId = new URLSearchParams(location.search).get("video") || "";
      if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        document.getElementById("player-shell").innerHTML =
          '<p id="message">This YouTube link is invalid. Return to Snorlax’s Cave and try another link.</p>';
      } else {
        const embedUrl = new URL(`https://www.youtube.com/embed/${videoId}`);
        embedUrl.searchParams.set("rel", "0");
        embedUrl.searchParams.set("playsinline", "1");
        embedUrl.searchParams.set("origin", location.origin);
        document.getElementById("youtube-player").src = embedUrl.href;
      }
    </script>
  </body>
</html>
